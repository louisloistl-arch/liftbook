<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liftbook">
<meta name="theme-color" content="#0B132B">
<title>Liftbook</title>
<style>@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(barlow-condensed-500.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(barlow-condensed-600.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(barlow-condensed-700.woff2) format('woff2')}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--sab:env(safe-area-inset-bottom)}
:root{
  --bg:#0B132B; --surface:#1C2541; --surface2:#24304F; --line:#3A506B; --line-soft:rgba(58,80,107,.55);
  --text:#EEF2F8; --text2:#B4C0D3; --muted:#8395B0;
  --sky:#5BC0DE; --sand:#F4D6B0; --amber:#D97706;
  --cta:linear-gradient(180deg,#FFB347 0%,#F7860F 100%); --cta-solid:#F7860F; --cta-ink:#0B132B;
  --danger:#F07A6A;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --num:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
#app{position:fixed;inset:0;max-width:540px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(var(--tabh) + var(--sab) + 96px)}
.screen.full{padding-bottom:calc(var(--sab) + 120px)}
.pushed{background:var(--bg);z-index:5;animation:pushIn .38s var(--ease)}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}

/* Large title header, iOS style */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 10px}
.lt h1{font-family:var(--num);font-weight:700;font-size:40px;letter-spacing:.2px;line-height:1;margin:0}
.lt .act{font-size:16px;color:var(--sky);padding:6px 2px}
.navbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin:0 -6px}
.navbar .back{display:flex;align-items:center;gap:2px;color:var(--sky);font-size:17px;padding:8px 6px}
.navbar .back svg{width:22px;height:22px}
.navbar .ttl{font-weight:600;font-size:17px}
.navbar .r{color:var(--sky);font-size:17px;padding:8px 6px}

.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.sec-h h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.2px}
.sec-h .meta{color:var(--muted);font-size:14px}
.sec-h button{color:var(--sky);font-size:15px}
.hint{color:var(--muted);font-size:14px;margin:6px 4px 0}

/* grouped list */
.list{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line-soft)}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13.5px;color:var(--muted);margin-top:1px}
.row .chev{width:16px;height:16px;color:var(--line);flex:none}
.row.add{color:var(--sky);font-weight:550}
.row.danger{color:var(--danger)}
.press{transition:transform .14s var(--ease),background-color .14s,opacity .14s}
.press:active{transform:scale(.97)}
.row.press:active{transform:none;background:var(--surface2)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tgts{display:flex;gap:16px;margin-top:5px}
.tgt{font-family:var(--num);font-size:17px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tgt small{font-family:var(--ui);font-size:12px;color:var(--muted);font-weight:500}
.tgt.nil{color:var(--line);font-family:var(--ui)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:650;font-size:17px}
.btn.cta{background:var(--cta);color:var(--cta-ink);box-shadow:0 8px 22px -8px rgba(247,134,15,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.line{border:1.5px solid var(--line);color:var(--text2)}
.btn.block{width:100%}
.btn.sm{height:38px;font-size:15px;padding:0 14px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--sky);font-size:15px;font-weight:550;padding:6px 0}

/* next-up hero */
.next{margin-top:6px;padding:20px 18px 18px;border-radius:var(--r-lg);background:
  radial-gradient(120% 90% at 100% 0%, rgba(91,192,222,.16), transparent 60%), var(--surface);position:relative;overflow:hidden}
.next .nk{display:flex;justify-content:space-between;align-items:center;margin-top:-6px}
.next .k{color:var(--text2);font-size:14px}
.next .day{font-family:var(--num);font-weight:700;font-size:56px;line-height:.92;margin:6px 0 4px;letter-spacing:.3px}
.next .day span{color:var(--muted);font-weight:600;font-size:22px;margin-left:10px;letter-spacing:0}
.next .s{color:var(--text2);font-size:14.5px}
.next .acts{display:flex;gap:10px;margin-top:18px}
.next .acts .btn{white-space:nowrap}
.next .acts .cta{flex:1}
.next .acts .ghost{padding:0 16px}

/* day blocks */
.dayhead{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.daynum{font-family:var(--num);font-weight:700;font-size:15px;color:var(--bg);background:var(--text2);border-radius:7px;padding:1px 7px}
.dayhead h2{margin:0;font-size:20px;font-weight:650;flex:1}
.dayhead .isnext{font-size:12.5px;color:var(--sand);border:1px solid rgba(244,214,176,.4);border-radius:20px;padding:2px 9px}
.slotmark{font-size:12px;color:var(--sand);border:1px dashed rgba(244,214,176,.5);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:500}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:6px 10px calc(var(--sab) + 6px);
  background:rgba(11,19,43,.82);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line-soft);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:550;color:var(--muted);padding:4px 0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--sky)}
.fab{position:relative;justify-self:center;width:60px;height:60px;border-radius:20px;background:var(--cta);color:var(--cta-ink);display:grid;place-items:center;margin-top:-24px;
  box-shadow:0 10px 28px -4px rgba(247,134,15,.75),0 0 0 6px var(--bg),inset 0 1px 0 rgba(255,255,255,.45)}
.fab svg{width:28px;height:28px}
.fab.live{background:var(--sky)}
.fab.live::after{content:"";position:absolute;width:58px;height:58px;border-radius:20px;border:2px solid var(--sky);animation:ring 1.8s var(--ease) infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.35);opacity:0}}

.livebar{position:absolute;left:12px;right:12px;bottom:calc(var(--tabh) + var(--sab) + 10px);z-index:19;display:flex;align-items:center;gap:12px;
  background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
.livebar .pulse{width:9px;height:9px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 0 rgba(91,192,222,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(91,192,222,0)}100%{box-shadow:0 0 0 0 rgba(91,192,222,0)}}
.livebar .main{flex:1;min-width:0}
.livebar .t{font-weight:600;font-size:15px}
.livebar .s{color:var(--muted);font-size:13px}

/* segmented */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14.5px;font-weight:550;color:var(--text2);white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--sky);color:var(--bg);font-weight:700;box-shadow:0 4px 14px -5px rgba(91,192,222,.6)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--surface);color:var(--text2);font-size:14.5px;font-weight:550;display:inline-flex;align-items:center;gap:7px;border:1.5px solid transparent}
.chip.on{background:var(--surface2);color:var(--text);border-color:var(--line)}
.chip .dot{width:9px;height:9px}

/* sheet */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(5,9,22,.62);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;
  animation:up .38s var(--ease);padding-bottom:var(--sab)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 8px;flex:none}
.sheet .sh h3{margin:0;font-size:19px;font-weight:650}
.sheet .sh button{color:var(--sky);font-size:16.5px;font-weight:600;padding:6px 0}
.sheet .sb{overflow-y:auto;padding:4px 18px 22px;-webkit-overflow-scrolling:touch}
.sheet .list{background:var(--surface2)}
.sheet .row+.row::before{background:rgba(58,80,107,.7)}
.sheet .chip,.sheet .seg{background:var(--surface2)}
.sheet .chip.on{background:#33426A}
.field{margin-top:18px}
.field>label,.flabel{display:block;font-size:13.5px;color:var(--muted);margin:0 4px 7px}
.inp{width:100%;height:46px;border-radius:12px;background:var(--surface2);border:1.5px solid transparent;padding:0 14px;font-size:16.5px;outline:none}
.inp:focus{border-color:var(--sky)}
textarea.inp{height:auto;min-height:70px;padding:12px 14px;resize:none}
.sheet .inp{background:var(--bg)}
select.inp{appearance:none;-webkit-appearance:none}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:22px;font-weight:500;color:var(--text)}
.sheet .stepper button{background:var(--bg)}
.stepper .v{min-width:52px;text-align:center;font-family:var(--num);font-size:26px;font-weight:600}

/* dialog */
.dialog{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);z-index:61;background:var(--surface2);border-radius:20px;padding:20px 18px 14px;animation:pop .26s var(--ease)}
@keyframes pop{from{transform:translateY(-50%) scale(.94);opacity:0}}
.dialog p{margin:0 4px 16px;font-size:16px;color:var(--text)}
.dialog .d2{display:flex;gap:10px}
.dialog .d2 .btn{flex:1;height:46px;font-size:16px}
.scrim.top{z-index:60}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:80;background:var(--sand);color:var(--cta-ink);font-weight:650;font-size:15px;
  padding:10px 16px;border-radius:14px;animation:toast 2.6s var(--ease) forwards;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}

/* ===== Training ===== */
.tr{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.tr-top{flex:none;padding:calc(env(safe-area-inset-top) + 4px) 14px 0;display:flex;align-items:center;justify-content:space-between;height:calc(env(safe-area-inset-top) + 48px)}
.tr-top button{color:var(--sky);font-size:16.5px;padding:8px 4px}
.tr-top .prog{display:flex;gap:4px;align-items:center}
.tr-top .prog i{width:14px;height:5px;border-radius:3px;background:var(--line);display:block}
.tr-top .prog i.d{background:var(--text2)}
.tr-top .prog i.c{background:var(--sand);width:22px}
.tr-top .prog i.s{background:var(--line);opacity:.4}
.tr-body{flex:1;overflow-y:auto;padding:4px 16px 140px;-webkit-overflow-scrolling:touch}
.ex-h{margin:6px 2px 12px}
.ex-h .k{color:var(--muted);font-size:14px}
.ex-h h1{font-family:var(--num);font-weight:700;font-size:42px;line-height:.95;margin:2px 0 0;letter-spacing:.2px}
.ex-vars{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.ex-vars::-webkit-scrollbar{display:none}
.ex-vars .chip{flex:none}
.ex-vars .chip.add{color:var(--sky);background:transparent;border:1.5px dashed var(--line)}

/* the duo switch */
.duo{display:grid;gap:8px;margin:16px 0 14px}
.who{position:relative;border-radius:16px;padding:10px 12px 10px 14px;background:var(--surface);text-align:left;overflow:hidden;border:1.5px solid transparent;transition:background-color .3s var(--ease),border-color .3s}
.who .nm{font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px}
.who .st{font-size:13px;color:var(--muted);margin-top:2px}
.who .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.who.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--surface))}
.who.on .st{color:var(--text2)}
.who .turn{position:absolute;right:10px;top:10px;font-size:11.5px;font-weight:700;color:var(--bg);background:var(--pc);border-radius:8px;padding:2px 7px;opacity:0;transform:scale(.8);transition:all .3s var(--ease)}
.who.on .turn{opacity:1;transform:none}
.who.fin .st{color:var(--text2)}

/* "to beat" card */
.beat{border-radius:var(--r-lg);background:var(--surface);padding:14px 16px 16px;position:relative}
.beat .bh{display:flex;justify-content:space-between;align-items:baseline}
.beat .bh .k{font-size:14px;color:var(--text2);font-weight:550}
.beat .bh .d{font-size:13px;color:var(--muted)}
.beat .bsets{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.beat .bs{display:flex;flex-direction:column}
.beat .bs .r{font-family:var(--num);font-weight:700;font-size:44px;line-height:.95;color:var(--text)}
.beat .bs .r small{font-size:18px;color:var(--muted);font-weight:600;margin-left:2px}
.beat .bs .w{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap}
.beat .none{color:var(--muted);font-size:15px;margin-top:6px}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:13px;font-size:14.5px;line-height:1.35}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.intent{background:rgba(244,214,176,.12);color:var(--sand);border:1px solid rgba(244,214,176,.28)}
.note.intent b{color:var(--text)}
.note.info{background:var(--surface2);color:var(--text2)}
.note.sugg{background:rgba(91,192,222,.1);color:#BFE6F2;border:1px solid rgba(91,192,222,.25);align-items:center}
.note.sugg .main{flex:1}
.note.sugg button{color:var(--bg);background:var(--sky);font-weight:650;font-size:13.5px;border-radius:9px;padding:6px 10px;flex:none}
.srcsw{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
.srcsw .flabel{margin:0}
.srcsw .seg{width:190px}
.srcsw .seg button{height:28px;font-size:13px}

/* sets */
.sets{display:flex;flex-direction:column;gap:8px}
.set{border-radius:16px;background:var(--surface);padding:10px 12px;display:flex;align-items:center;gap:12px;transition:background-color .25s}
.set .n{width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:17px;color:var(--text2);flex:none}
.set .val{flex:1;display:flex;align-items:baseline;gap:8px;font-family:var(--num);font-weight:600;font-size:24px}
.set .val small{font-family:var(--ui);font-size:13px;color:var(--muted);font-weight:500}
.set .val .x{color:var(--muted);font-size:18px}
.set.done .n{background:var(--pc);color:var(--bg)}
.set.done .n svg{width:16px;height:16px}
.set.skip{opacity:.45}
.set.skip .val{text-decoration:line-through;text-decoration-thickness:1.5px}
.set .edit{color:var(--muted);font-size:13.5px;padding:6px 2px}
.set.cur{flex-direction:column;align-items:stretch;background:color-mix(in srgb,var(--pc) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--pc) 55%,transparent);padding:12px}
.set.cur .top{display:flex;align-items:center;gap:12px}
.set.cur .top .lbl{flex:1;font-size:14px;color:var(--text2)}
.wstep{display:flex;align-items:center;gap:6px}
.wstep button{width:42px;height:42px;border-radius:12px;background:var(--surface2);font-size:24px;display:grid;place-items:center}
.wstep .wv{min-width:92px;height:42px;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:4px;font-family:var(--num);font-weight:700;font-size:30px;border-radius:10px;background:transparent;border:0;padding:0}
.wstep .wv small{font-family:var(--ui);font-size:13px;color:var(--muted);font-weight:500}
.wstep input.wv{width:92px;background:var(--bg);border:1.5px solid var(--sky);font-size:26px;outline:none}
.wline{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.wline .flabel{margin:0}
.reps-l{margin:14px 0 8px;display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.reps{display:flex;gap:8px;overflow-x:auto;margin:0 -12px;padding:2px 12px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.reps::-webkit-scrollbar{display:none}
.rep{flex:none;width:52px;height:56px;border-radius:14px;background:var(--surface2);font-family:var(--num);font-weight:700;font-size:26px;color:var(--text2);position:relative;scroll-snap-align:center;
  transition:transform .12s var(--ease),background-color .15s}
.rep.goal{background:#2C3A5E;color:var(--text)}
.rep.last::after{content:"";position:absolute;left:50%;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--sand);transform:translateX(-50%)}
.rep:active{transform:scale(.9);background:var(--pc);color:var(--bg)}
.set-acts{display:flex;justify-content:space-between;margin-top:8px}
.set-acts button{font-size:14px;color:var(--muted);padding:6px 2px}
.timebox{display:flex;align-items:center;gap:12px;margin-top:12px}
.timebox .clock{flex:1;font-family:var(--num);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums}
.tchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tchips button{height:38px;padding:0 13px;border-radius:11px;background:var(--surface2);font-family:var(--num);font-weight:600;font-size:19px;color:var(--text2)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.cgrid label{font-size:12.5px;color:var(--muted);display:block;margin:0 2px 5px}
.cgrid .inp{text-align:center;font-family:var(--num);font-size:24px;font-weight:600;background:var(--bg)}
.more{display:flex;gap:18px;justify-content:center;margin-top:14px}
.more button{font-size:14px;color:var(--muted);padding:6px}

.tr-foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(var(--sab) + 12px);background:linear-gradient(to top,var(--bg) 70%,rgba(11,19,43,0))}

/* exercise done panel */
.donep{margin-top:18px;border-radius:var(--r-lg);background:var(--surface);padding:16px}
.donep h3{margin:0 0 4px;font-family:var(--num);font-size:28px;font-weight:700}
.donep .pp{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:12px}
.donep .pp .nm{display:flex;align-items:center;gap:8px;font-weight:650}
.donep .pp .sum{color:var(--text2);font-size:14px;margin:3px 0 10px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tog span{font-size:15px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background-color .2s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--cta-solid)}
.sw.on::after{transform:translateX(20px)}
.pr{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--cta-ink);background:var(--sand);border-radius:7px;padding:2px 7px}
.pr svg{width:12px;height:12px}

/* slot picker in training */
.pick .row .t{font-weight:550}

/* summary */
.sum-h{text-align:left;margin:20px 2px 0}
.sum-h .k{color:var(--muted);font-size:14px}
.sum-h h1{font-family:var(--num);font-size:40px;font-weight:700;line-height:.95;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:var(--surface);border-radius:16px;padding:12px}
.stat .v{font-family:var(--num);font-weight:700;font-size:30px;line-height:1;white-space:nowrap}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.prlist .row .t{display:flex;align-items:center;gap:8px}
.burst{animation:burst .9s var(--ease)}
@keyframes burst{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none}}

/* history */
.spark{width:72px;height:28px;flex:none}
.hval{text-align:right;flex:none}
.hval .v{font-family:var(--num);font-weight:700;font-size:21px;line-height:1}
.hval .l{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border-radius:var(--r-lg);padding:14px 12px 10px;margin-top:12px;position:relative}
.chart .ch{display:flex;justify-content:space-between;align-items:center;margin:0 4px 6px}
.chart .ch .k{font-size:14px;color:var(--text2);font-weight:550}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.legend{display:flex;gap:14px;margin:4px 6px 0;font-size:13px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;white-space:nowrap;z-index:2;box-shadow:0 8px 20px -8px rgba(0,0,0,.7)}
.tip .td{color:var(--muted);margin-bottom:3px}
.tip .tr2{display:flex;align-items:center;gap:6px;font-weight:600}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:15px;background:var(--surface);border-radius:var(--r-md)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.sline{font-size:14px;color:var(--text2);margin-top:4px}
.sline b{font-family:var(--num);font-size:18px;color:var(--text);font-weight:600}

/* calendar */
.cal{background:var(--surface);border-radius:var(--r-lg);padding:12px 10px 10px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.cal .mh b{font-size:17px}
.cal .mh button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sky)}
.cal .mh button svg{width:20px;height:20px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:4px}
.cal .c{aspect-ratio:1/1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;color:var(--text2);position:relative}
.cal .c.has{background:var(--surface2);color:var(--text);font-weight:650}
.cal .c.today{box-shadow:inset 0 0 0 1.5px var(--sand)}
.cal .c .ds{display:flex;gap:2px;height:6px}
.cal .c .ds i{width:5px;height:5px;border-radius:50%}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* profile */
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;color:var(--bg);flex:none}
.colors{display:flex;gap:12px}
.colors button{width:40px;height:40px;border-radius:13px;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.syncs{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14.5px;color:var(--text2)}
.syncs i{width:9px;height:9px;border-radius:50%;flex:none}
.codebox{width:100%;height:160px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.mtop{margin-top:14px}
.ctr{text-align:center}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.repr .stepper button{width:38px;height:40px}
.repr .stepper .v{min-width:40px;font-size:24px}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 70% at 50% 38%,#1C2541 0%,#0B132B 62%);display:grid;place-items:center;
  transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;transform:translateY(-4vh)}
.sp-bb{width:270px;height:auto;overflow:visible}
.sp-lift{animation:spLift .5s .95s var(--ease) both;transform-origin:center}
@keyframes spLift{0%{transform:none}45%{transform:translateY(-12px)}100%{transform:none}}
.sp-bar{stroke-dasharray:200;animation:spBar .45s .05s var(--ease) both}
@keyframes spBar{from{stroke-dashoffset:200}}
.sp-pl{animation:spPlL .5s var(--ease) both}
.sp-pr{animation:spPlR .5s var(--ease) both}
.sp-d1{animation-delay:.38s}.sp-d2{animation-delay:.56s}
@keyframes spPlL{from{transform:translateX(-70px);opacity:0}70%{transform:translateX(3px);opacity:1}}
@keyframes spPlR{from{transform:translateX(70px);opacity:0}70%{transform:translateX(-3px);opacity:1}}
.sp-word{font-family:var(--num);font-weight:700;font-size:64px;line-height:1;letter-spacing:.5px;margin-top:22px;color:var(--text);animation:spUp .55s 1.15s var(--ease) both}
.sp-sub{margin-top:10px;font-size:15px;color:var(--text2);min-height:20px;animation:spUp .55s 1.3s var(--ease) both}
.sp-sub b{color:var(--sand);font-weight:650}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}}
.sp-shadow{animation:spShadow .5s .95s var(--ease) both;transform-origin:120px 96px}
@keyframes spShadow{45%{transform:scaleX(.8);opacity:.5}}

.rseg button{height:30px;font-size:13px;padding:0 4px}
.mseg button{height:30px;font-size:13px}
.hval .v.up,.sline b.up{color:#7FD08F}
.chart .ch .small{font-size:12.5px}

.bwrow{display:grid;grid-template-columns:1fr 1.35fr auto;gap:8px;margin-top:12px}
.bwrow .inp{background:var(--bg);padding:0 10px;min-width:0}
.bwrow input[type=date]{font-size:15px;color:var(--text)}
.bwrow input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.bwrow .btn{padding:0 14px;height:46px;font-size:16px}

/* swipe rows */
.sw-wrap{position:relative;overflow:hidden;background:#D9483B;touch-action:pan-y}
.sw-wrap+.sw-wrap .sw-row::before,.sw-wrap+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line-soft)}
.sw-row{background:var(--surface);transition:transform .28s var(--ease);touch-action:pan-y}
.sw-del{position:absolute;right:0;top:0;bottom:0;width:88px;color:#fff;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;transition:width .2s var(--ease)}
.sw-wrap.full .sw-del{width:100%;justify-content:flex-end;padding-right:22px}
.sw-wrap:not(.open):not(.full) .sw-del{pointer-events:none}
.grip{color:var(--muted);width:40px;height:40px;margin:-8px -8px -8px 0;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.grip svg{width:22px;height:22px}
.sw-wrap.dragging{z-index:5;overflow:visible;background:transparent}
.sw-wrap.dragging .sw-row{background:var(--surface2);box-shadow:0 14px 30px -10px rgba(0,0,0,.7);transform:scale(1.02);border-radius:12px;transition:none}
.sw-wrap.dragging .sw-del{display:none}
body.is-dragging,body.is-dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
/* undo toast */
.undo{position:absolute;left:14px;right:14px;bottom:calc(var(--tabh) + var(--sab) + 14px);z-index:70;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 12px 12px 16px;font-size:15px;font-weight:550;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);animation:undoIn .3s var(--ease);transition:opacity .35s,transform .35s var(--ease)}
.undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo button{font-weight:700;color:#0B6E8C;padding:4px 6px}
.undo.gone{opacity:0;transform:translateY(10px)}
@keyframes undoIn{from{opacity:0;transform:translateY(16px)}}
/* item sheet */
.stepper.sm button{width:38px;height:38px;border-radius:11px;font-size:20px}
.stepper.sm .v{min-width:58px;font-size:22px;display:flex;align-items:baseline;justify-content:center;gap:3px}
.stepper.sm .v small{font-family:var(--ui);font-size:11.5px;color:var(--muted);font-weight:500}
.stepper .vbtn{height:38px;border-radius:9px;color:var(--text);font-family:var(--num);font-weight:600}
.stepper .vin{width:74px;height:38px;border-radius:9px;background:var(--bg);border:1.5px solid var(--sky);text-align:center;font-family:var(--num);font-size:21px;font-weight:600;outline:none;padding:0}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.row.col .rowtop{display:flex;align-items:center;gap:12px}
.bigv{font-family:var(--num);font-weight:700;font-size:24px}
.chips.tight{gap:6px}
.chips.tight .chip{height:32px;padding:0 11px;font-size:14px;background:var(--bg)}
.sheet .chips.tight .chip.on{background:#33426A}
.repr{display:flex;align-items:center;gap:8px}
.av.sm{width:28px;height:28px;border-radius:9px;font-size:16px}
.wgrid{display:grid;gap:6px}
.wgrid label span{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px 2px}
.wgrid .inp{padding:0 4px;text-align:center;font-family:var(--num);font-size:19px;font-weight:600;height:42px}

/* collapsible days */
.dayhead .dh-t{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:6px 0}
.dayhead .dh-t h2{flex:none}
.dcount{font-size:13.5px;color:var(--muted);flex:1;white-space:nowrap}
.dchev{display:grid;place-items:center;width:22px;height:22px;transition:transform .3s var(--ease)}
.dchev .chev{width:18px;height:18px;color:var(--muted)}
.sec.day:not(.closed) .dchev{transform:rotate(90deg)}
.dbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s var(--ease)}
.dinner{overflow:hidden;min-height:0}
.sec.day.closed .dbody{grid-template-rows:0fr}
.sec.day.closed .elink{opacity:0;pointer-events:none}
.elink{transition:opacity .2s}
.sec.day{margin-top:14px}
.sec.day+.sec.day{margin-top:10px}
.sec.day.closed .dayhead{margin-bottom:0}

.repr{gap:6px}
.repr .stepper.sm button{width:34px;height:36px}
.repr .stepper.sm .v{min-width:34px}

/* bento dashboard */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:22px;padding:14px 14px 12px;min-height:168px;overflow:hidden;
  background:linear-gradient(155deg,#26335A 0%,#1C2541 55%,#18203A 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tile.wide{grid-column:1/-1;min-height:150px}
.tile .th b{display:block;font-size:16px;font-weight:650;line-height:1.2}
.tile .th span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tile .th.row2{display:flex;justify-content:space-between;align-items:flex-start}
.tile .tv{font-family:var(--num);font-weight:700;font-size:28px;line-height:1;display:inline-flex;align-items:baseline;gap:4px}
.tile .tv small{font-family:var(--ui);font-size:12.5px;color:var(--muted);font-weight:500}
.tile .th.row2 .tv{font-size:32px;align-items:center}
.tile .th.row2 .tv .chev{width:16px;height:16px;color:var(--text2);margin-left:4px}
.tile .tf{margin-top:auto;padding-top:10px;border-top:1px solid rgba(58,80,107,.55);display:flex;align-items:center;justify-content:space-between}
.tile .tf .chev{width:16px;height:16px;color:var(--text2)}
.tile .tsub{font-size:12.5px;color:var(--text2)}
.ring{position:relative;width:96px;height:96px;margin:8px auto 10px}
.ring svg{width:100%;height:100%}
.ring circle{transition:stroke-dasharray .6s var(--ease)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .rv b{font-family:var(--num);font-size:30px;font-weight:700}
.ring .rv span{font-size:12px;color:var(--muted);margin-top:2px}
.g30{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 12px;padding:8px;border-radius:12px;background:rgba(11,19,43,.55)}
.g30 i{aspect-ratio:1/1;border-radius:3px;background:#2A3658}
.g30 i.today{box-shadow:0 0 0 1.5px var(--sand)}
.tchart{position:relative;margin:10px 2px 8px;flex:1;min-height:64px}
.tchart.sm{height:64px;flex:none;margin:12px 2px 10px}
.tspark{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tdots{position:absolute;inset:0;pointer-events:none}
.tdots i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2.2px solid;background:#1C2541}
.tempty{display:flex;align-items:center;height:100%;min-height:60px;font-size:13.5px;color:var(--muted)}
/* plan rows */
.row .grp{font-size:12px;color:var(--muted);margin-bottom:1px}
.swapb{width:40px;height:40px;margin:-6px -8px -6px 0;border-radius:12px;display:grid;place-items:center;color:var(--text2);flex:none}
.swapb svg{width:20px;height:20px}
.swapb:active{background:var(--surface2)}

.minus{width:26px;height:26px;border-radius:50%;background:#D9483B;display:grid;place-items:center;flex:none;margin-left:-2px}
.minus i{width:11px;height:2.4px;border-radius:2px;background:#fff;display:block}
.sw-wrap.open .minus{transform:rotate(-90deg);transition:transform .25s var(--ease)}

.bento-h{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;margin:14px 4px 0;font-size:20px;font-weight:650}
.bento-h span{font-size:14px;color:var(--muted);font-weight:500}
.tile .tv .delta{font-family:var(--ui);font-size:12px;font-weight:650;color:#7FD08F;margin-left:6px;align-self:center}

.ex-h .kx{display:flex;justify-content:space-between;align-items:center}
.ex-h .kx .link{font-size:14.5px;padding:2px 0}

/* training simplification */
.exrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.morebtn{width:40px;height:40px;border-radius:13px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:3px;flex:none;margin-top:2px}
.morebtn i{width:4.5px;height:4.5px;border-radius:50%;background:var(--text2)}
.reps-l .ask{font-size:15px;font-weight:600;color:var(--text)}
.set-acts{justify-content:flex-end}

/* ===== Training: klare Hierarchie (Info flach, Aktionen deutlich) ===== */
/* Info-Karte "Letztes Mal": kein Button-Look */
.beat{background:transparent;border:1.5px solid rgba(58,80,107,.7)}
/* Personen-Umschalter: dezenter, aktiver klar */
.who{background:transparent;border:1.5px solid rgba(58,80,107,.6)}
.who.on{background:color-mix(in srgb,var(--pc) 22%,transparent);border-color:var(--pc)}
/* Noch offene Sätze: flach, nicht klickbar wirkend */
.set{background:transparent;border:1.5px dashed rgba(58,80,107,.75)}
.set .n{background:transparent;border:1.5px solid rgba(58,80,107,.9)}
.set.done{background:color-mix(in srgb,var(--pc) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--pc) 35%,transparent)}
.set.done .n{border:0}
/* Aktueller Satz: hebt sich klar ab */
.set.cur{background:#1F2B4D;border:2px solid var(--pc);box-shadow:0 14px 34px -14px color-mix(in srgb,var(--pc) 60%,transparent)}
.set.cur .top .n{background:var(--pc);color:var(--bg);border:0}
/* Aktionen sehen wie Buttons aus */
.wstep button{background:#2F3E66;color:var(--sky);border:1.5px solid rgba(91,192,222,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.wstep button:active{background:var(--sky);color:var(--bg)}
.rep{background:#33446E;color:#E6ECF6;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 8px -3px rgba(0,0,0,.6)}
.rep.goal{background:#3C5590;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(91,192,222,.75),0 3px 8px -3px rgba(0,0,0,.6)}
.rep.last::after{width:6px;height:6px;bottom:5px}
.rep:active{transform:scale(.9);background:var(--cta-solid);color:var(--bg)}
.reps-l .ask{font-size:16px}
.reps-hint{display:flex;gap:14px;margin:2px 2px 0;font-size:12px;color:var(--muted)}
.reps-hint i{display:inline-block;vertical-align:middle;margin-right:5px}
.reps-hint .g{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(91,192,222,.75);background:#3C5590}
.reps-hint .l{width:6px;height:6px;border-radius:50%;background:var(--sand)}
.wstep .wv{background:transparent;border:0;box-shadow:none;color:var(--text)}
.wstep button.wv:active{background:transparent;color:var(--text)}

/* notes in training */
.addnote{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 4px;font-size:14px;color:var(--muted)}
.addnote svg{width:16px;height:16px}
.nbtn{width:100%;text-align:left;align-items:center}
.nbtn .main{flex:1}
.nedit{align-items:center}
.ninp{flex:1;background:var(--bg);border:1.5px solid var(--sky);border-radius:9px;height:38px;padding:0 10px;font-size:15px;color:var(--text);outline:none;min-width:0}
/* verdict */
.verdict{position:absolute;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,9,22,.55);animation:fade .2s ease;transition:opacity .25s}
.verdict.gone{opacity:0}
.vbox{width:min(300px,82%);background:#2A1E2B;border:2px solid #E5534B;border-radius:24px;padding:22px 20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;animation:vpop .45s var(--ease);box-shadow:0 20px 50px -15px rgba(229,83,75,.5)}
@keyframes vpop{0%{transform:scale(.6) rotate(-6deg);opacity:0}60%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:none}}
.vemo{font-size:44px;line-height:1;animation:vshake .6s .3s}
@keyframes vshake{20%,60%{transform:translateX(-6px) rotate(-8deg)}40%,80%{transform:translateX(6px) rotate(8deg)}}
.vbox b{font-family:var(--num);font-size:40px;font-weight:700;color:#FF8A80;line-height:1.05;margin-top:6px}
.vwho{font-size:14px;color:var(--text);font-weight:600}
.vtxt{font-size:14px;color:var(--text2);margin-bottom:10px}
.vbox .btn{min-width:120px}
.nix{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:#D9483B;border-radius:8px;padding:2px 8px}
.nixtxt{font-size:13px;color:#FF8A80;margin:-6px 0 8px}

.verdict.good .vbox{background:#1B2E2A;border-color:#4FBF7A;box-shadow:0 20px 50px -15px rgba(79,191,122,.5)}
.verdict.good .vbox b{color:#7FE0A2}
.verdict.good .vemo{animation:vflex .7s .3s}
@keyframes vflex{30%{transform:scale(1.25) rotate(-10deg)}60%{transform:scale(1.15) rotate(8deg)}}
.nix.ok{background:#3E9E62}
.nixtxt.ok{color:#7FE0A2}
.wstep .wv{text-decoration:underline dotted rgba(180,192,211,.5);text-underline-offset:5px;text-decoration-thickness:2px}
[data-hold]{-webkit-touch-callout:none;touch-action:manipulation}

.pwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.elapsed{font-family:var(--num);font-size:15px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.tr-top{height:calc(env(safe-area-inset-top) + 54px)}

/* Zirkel */
.cmins{display:flex;gap:8px}
.cmins .rep{flex:1;width:auto}
.rep.sel{background:var(--cta-solid);color:var(--bg);box-shadow:0 6px 16px -6px rgba(247,134,15,.7)}
.cd{position:relative;width:min(300px,80vw);aspect-ratio:1/1;margin:8px auto 18px;color:var(--sky)}
.cd svg{width:100%;height:100%}
.cd.hot{color:#FF6B5E}
.cd.done{color:#4FBF7A}
.cd.pause{color:var(--muted)}
.cd .cdin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd .cdin b{font-family:var(--num);font-weight:700;font-size:84px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.cd.hot .cdin b{color:#FF8A80}
.cd .cdin span{font-size:15px;color:var(--text2);margin-top:4px}
.cd.flash{animation:cdflash .5s 4}
@keyframes cdflash{50%{transform:scale(1.06);filter:brightness(1.6)}}
.crounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cr{position:relative;border:2px solid var(--pc);border-radius:20px;padding:12px;background:color-mix(in srgb,var(--pc) 12%,transparent);display:flex;flex-direction:column;align-items:center;gap:6px}
.crn{font-weight:650}
.crv{font-family:var(--num);font-size:48px;font-weight:700;line-height:1}
.crplus{width:100%;height:52px;border-radius:14px;background:var(--pc);color:var(--bg);font-weight:700;font-size:17px}
.crminus{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;color:var(--text2);font-size:18px;border:1.5px solid rgba(58,80,107,.9)}

.cminbox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:20px;background:#1F2B4D;border:2px solid var(--sky)}
.cminbox>button.press{width:64px;height:64px;border-radius:18px;background:#2F3E66;color:var(--sky);border:1.5px solid rgba(91,192,222,.55);font-size:32px;flex:none}
.cminbox>button.press:active{background:var(--sky);color:var(--bg)}
.cminv{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.cminv b{font-family:var(--num);font-size:64px;font-weight:700;color:var(--text);text-decoration:underline dotted rgba(180,192,211,.5);text-underline-offset:8px;text-decoration-thickness:2px}
.cminv span{font-size:14px;color:var(--text2);margin-top:6px}
.cminin{flex:1;min-width:0;height:72px;text-align:center;font-family:var(--num);font-size:56px;font-weight:700;background:var(--bg);border:1.5px solid var(--sky);border-radius:14px;color:var(--text);outline:none}

.onb{padding-top:calc(env(safe-area-inset-top) + 40px)}
.onb-h{margin:10px 2px 8px}
.onb-k{color:var(--text2);font-size:15px}
.onb-h h1{font-family:var(--num);font-size:60px;font-weight:700;line-height:1;margin:4px 0 10px}
.onb-h p{color:var(--text2);font-size:15.5px;margin:0;line-height:1.45}

.wstep .wv.need{font-family:var(--ui);font-size:15px;font-weight:650;color:var(--sand);border:1.5px dashed rgba(244,214,176,.6);border-radius:10px;padding:0 10px;min-width:92px;text-decoration:none}

.sp-bk{width:150px;height:auto;overflow:visible}
.sp-book{animation:spBook .55s var(--ease) both;transform-origin:124px 320px}
@keyframes spBook{from{opacity:0;transform:translateY(18px) scale(.86)}to{opacity:1;transform:none}}
.sp-bk .sp-bar{stroke-dasharray:none;animation:spBarW .4s .35s var(--ease) both;transform-origin:154px 160px}
@keyframes spBarW{from{transform:scaleX(0)}to{transform:none}}
.sp-mark{animation:spMark .45s .95s var(--ease) both}
@keyframes spMark{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.sp-bk .sp-shadow{transform-origin:124px 334px;animation:spUp .5s var(--ease) both}

/* Monatsrückblick */
.tile.recap{min-height:0;background:linear-gradient(135deg,rgba(217,119,6,.22),rgba(28,37,65,.9) 55%),var(--card)}
.rc-mini{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px}
.rc-mini b{display:block;font-family:var(--num);font-size:28px;font-weight:700;line-height:1}
.rc-mini b small{font-family:var(--ui);font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.rc-mini span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.recap-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.recap-head>div{text-align:center;flex:1}
.recap-head h1{font-size:30px;line-height:1.1;margin:0}
.rc-k{font-size:13px;color:var(--muted);margin-bottom:2px}
.rc-nav{width:40px;height:40px;border-radius:20px;background:var(--card);display:grid;place-items:center;color:var(--sky)}
.rc-nav svg{width:18px;height:18px}

.rc-nav:disabled{opacity:.3}
.rc-hero{margin-top:18px;text-align:center}
.rc-big{font-family:var(--num);font-weight:700;font-size:96px;line-height:.95;color:var(--text)}
.rc-lbl{font-size:17px;font-weight:600;margin-top:4px}
.rc-lbl span{display:block;font-size:13.5px;font-weight:500;color:var(--muted);margin-top:4px}
.rc-lbl span.up{color:#6FCF8F}
.rc-days{display:grid;gap:5px;margin:18px auto 0;max-width:330px}
.rc-days i{aspect-ratio:1;border-radius:4px;background:rgba(58,80,107,.45)}
.rc-kg .tv{font-size:40px;margin-top:14px}
.tile > .tsub{display:block;font-size:12.5px;color:var(--text2);margin-top:6px}
.rc-fav{font-size:19px;font-weight:700;line-height:1.2;margin-top:auto;padding-top:14px}
.tile .tf .tv .delta{margin-left:8px}
.tile .th.row2 > svg{width:16px;height:16px;color:var(--text2);flex:none;margin-top:2px}

.plbtn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 7px;border-radius:13px;background:rgba(91,192,222,.12);color:#5BC0DE;font-size:13px;font-weight:600}
.plbtn svg{width:15px;height:15px}
.pl-w{text-align:center;font-family:var(--num);font-weight:700;font-size:40px;margin-top:4px}
.pldraw{display:block;width:100%;max-width:340px;margin:10px auto 0}

.pl-set{margin-top:20px}
.pl-set summary{color:var(--sky);font-size:15px;cursor:pointer;list-style:none;text-align:center}
.pl-set summary::-webkit-details-marker{display:none}
.pl-set .chip.on{background:#5BC0DE;color:#0B132B;border-color:transparent}

.set .top .plbtn{margin-left:auto;flex:none}

.bwdate{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 4px;font-size:16px;color:var(--text2);min-height:46px}

.bwdate input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}

.bwlast{display:flex;align-items:baseline;gap:12px;margin-top:8px;flex-wrap:wrap}
.bwlast .r{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;color:var(--text2)}
.bwlast .r small{font-size:16px;margin-left:3px;color:var(--muted);font-family:var(--ui)}
.bwlast .l{font-size:14px;color:var(--muted)}
.bwnone{margin:8px 0 0;color:var(--muted);font-size:15px}
.beat .btn svg{width:18px;height:18px;margin-right:6px;vertical-align:-3px}

.bwlast .r+.r{margin-left:10px}
.bwl{font-size:14px;color:var(--muted);margin-top:6px}
.kfarow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--card)}
.kfarow .t{font-size:17px;font-weight:600}
.kfarow .s{font-size:13px;color:var(--muted);margin-top:2px}
.row .t .kfa{margin-left:10px;font-weight:500;color:var(--text2);font-size:15px}

.bsep{height:10px}

html{background:var(--bg)}

    g += `<text x="${L}" y="${top - 8}" font-size="11.5" font-weight="600" fill="#B4C0D3">${esc(pn.label)}</text>`;
    for (let v = v0; v <= v1 + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(58,80,107,.5)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="#8395B0">${num(v)}</text>`;
    pn.series.forEach(s => {
      const ps = s.pts.slice().sort((a, b) => a.t - b.t);
      if (ps.length > 1) g += `<polyline fill="none" stroke="${s.col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${pi ? 'stroke-dasharray="5 4"' : ''} points="${ps.map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>`;
      ps.forEach(p => g += pi ? `<rect x="${(X(p.t) - 4).toFixed(1)}" y="${(Y(p.v) - 4).toFixed(1)}" width="8" height="8" rx="2" fill="${s.col}" stroke="#1C2541" stroke-width="2"/>` : `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="${s.col}" stroke="#1C2541" stroke-width="2"/>`);
      const lp = ps[ps.length - 1]; g += `<text x="${X(lp.t) + 8}" y="${Y(lp.v) + 4}" font-size="11" font-weight="600" fill="#EEF2F8">${esc(pn.fmt(lp.v).replace(/ (kg|lbs|Wdh\.)$/, ''))}</text>`;
    });
    P.push({ top, h }); y = top + h + GAP;
  });
  const H = y - GAP + B;
  g += `<text x="${L}" y="${H - 6}" font-size="10.5" fill="#8395B0">${fmtDate(t0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10.5" fill="#8395B0">${fmtDate(t1)}</text>`;
  g += `<line class="xh" x1="0" x2="0" y1="${P[0].top}" y2="${H - B}" stroke="#B4C0D3" stroke-width="1" opacity="0"/>`;
  const series = panels.flatMap((pn, pi) => pn.series.map(s => ({ ...s, name: pn.series.length > 1 ? `${s.name} ${pi ? 'Wdh.' : 'Gewicht'}` : (pi ? 'Wiederholungen' : 'Gewicht'), fmt: pn.fmt })));
  charts[id] = { series, fmt: null, multiFmt: true, X, W, H };
  const ppl = [...new Map(panels.flatMap(pn => pn.series).map(s => [s.name, s.col])).entries()];
  const legend = ppl.length > 1 ? `<div class="legend">${ppl.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" data-chart="${id}" role="img" aria-label="Gewicht und Wiederholungen">${g}</svg>${legend}<div class="tip" hidden></div></div>`;
}
function bindChart(svg) {
  if (svg._bound) return; svg._bound = true;
  const box = svg.parentElement;
  const show = ev => {
    const c = charts[svg.dataset.chart]; if (!c) return;
    const tip = box.querySelector('.tip'), xh = svg.querySelector('.xh');
    if (c.type === 'bars') {
      const r = svg.getBoundingClientRect(); const pt = ev.touches ? ev.touches[0] : ev; const x = (pt.clientX - r.left) / r.width * c.W;
      let bi = 0; c.cx.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(c.cx[bi] - x)) bi = i; });
      xh.setAttribute('x', c.cx[bi] - c.bw / 2 - 2); xh.setAttribute('opacity', .14);
      tip.innerHTML = `<div class="tr2">${esc(c.tips[bi])}</div>`; tip.hidden = false;
      const tw = tip.offsetWidth, px = c.cx[bi] / c.W * r.width;
      tip.style.left = Math.min(Math.max(8, px - tw / 2 + 12), box.clientWidth - tw - 8) + 'px'; tip.style.top = '34px';
      return;
    }
    const times = [...new Set(c.series.flatMap(s => s.pts.map(p => p.t)))].sort((a, b) => a - b);
    const r = svg.getBoundingClientRect(); const pt = ev.touches ? ev.touches[0] : ev;
    const x = (pt.clientX - r.left) / r.width * c.W;
    let best = times[0]; times.forEach(t => { if (Math.abs(c.X(t) - x) < Math.abs(c.X(best) - x)) best = t; });
    xh.setAttribute('x1', c.X(best)); xh.setAttribute('x2', c.X(best)); xh.setAttribute('opacity', .5);
    const rows = c.series.map(s => { const p = s.pts.find(q => q.t === best); return p ? `<div class="tr2"><i class="dot" style="background:${s.col}"></i>${esc(s.name)}: ${esc((s.fmt || c.fmt)(p.v))}</div>` : ''; }).join('');
    tip.innerHTML = `<div class="td">${fmtDate(best)}</div>${rows}`; tip.hidden = false;
    const px = c.X(best) / c.W * r.width; const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(8, px - tw / 2 + 12), box.clientWidth - tw - 8) + 'px'; tip.style.top = '6px';
  };
  const hide = () => { const tip = box.querySelector('.tip'), xh = svg.querySelector('.xh'); if (tip) tip.hidden = true; if (xh) xh.setAttribute('opacity', 0); };
  svg.addEventListener('pointerdown', show); svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') show(e); });
  svg.addEventListener('pointerleave', hide); svg.addEventListener('touchend', () => setTimeout(hide, 1600));
}

function viewPushed(p) {
  const nav = (t, r = '') => `<div class="navbar"><button class="back" data-act="pop">${I.back}${esc(p.backLabel || 'Zurück')}</button><span class="ttl">${esc(t)}</span><span style="min-width:60px;text-align:right">${r}</span></div>`;
  if (p.type === 'hist') return nav('') + viewHistDetail(p);
  if (p.type === 'recap') return nav('') + viewRecap(p);
  if (p.type === 'exEdit') return nav('', `<button class="r" data-act="pop">Fertig</button>`) + viewExEdit(p);
  return '';
}
function viewHistDetail(p) {
  const ex = exById(p.exId); if (!ex) return '<div class="empty">Übung nicht gefunden</div>';
  const vars = ex.variants.filter(v => profiles().some(pr => hist(pr.id, ex.id, v.id).length));
  const v = varOf(ex, p.varId);
  const pid = ui.hPid || profiles()[0].id;
  const wReps = ex.mode === 'reps' && v.unit !== 'none';
  const useReps = wReps && ui.hMetric === 'reps';
  const useVol = !wReps && ui.hMetric === 'vol' && hasVolume(ex, v);
  const repSum = e => sumOf((e.sets || []).filter(q => !q.skip), q => q.r) || null;
  const mf = useReps ? repSum : useVol ? volume : metric;
  const fm = x => useReps ? `${x} Wdh.` : useVol ? fmtVol(v, x) : fmtMetric(ex, v, x);
  let h = `<header class="lt" style="padding-top:4px"><h1>${esc(ex.name)}</h1></header>`;
  if (vars.length > 1) h += `<div class="chips">${vars.map(x => `<button class="chip press ${x.id === v.id ? 'on' : ''}" data-act="hdVar" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div>`;
  else h += `<div class="small" style="margin:0 4px">${esc(v.name)}${profiles().length > 1 ? `, ${esc(prof(pid).name)}` : ''}</div>`;
  h += `<div style="margin-top:14px">${rangeSeg()}</div>`;
  if (wReps) h += `<div class="seg mseg" style="margin-top:8px"><button class="${!useReps ? 'on' : ''}" data-act="hMetric" data-v="max">Gewicht</button><button class="${useReps ? 'on' : ''}" data-act="hMetric" data-v="reps">Wiederholungen</button></div>`;
  else if (hasVolume(ex, v)) h += `<div class="seg mseg" style="margin-top:8px"><button class="${!useVol ? 'on' : ''}" data-act="hMetric" data-v="max">Beste Serie</button><button class="${useVol ? 'on' : ''}" data-act="hMetric" data-v="vol">Wdh. gesamt</button></div>`;
  const all = hist(pid, ex.id, v.id);
  const mine = all.filter(x => inRange(x.date));
  const others = profiles().filter(x => x.id !== pid && hist(x.id, ex.id, v.id).some(y => inRange(y.date)));
  const series = [pid, ...(p.cmp ? others.map(o => o.id) : [])].map(id => ({ pid: id, name: prof(id).name, col: pcol(id), pts: hist(id, ex.id, v.id).filter(x => inRange(x.date)).map(x => ({ t: new Date(x.date).getTime(), v: mf(x.e) })).filter(x => x.v != null) }));
  if (!all.length) h += `<div class="empty mtop"><b>Noch keine Einträge für ${esc(prof(pid).name)}</b>Mit ${esc(v.name)} wurde noch nicht trainiert.</div>`;
  else if (!mine.length) h += `<div class="empty mtop"><b>Kein Training in ${curRange()[3]}</b>Zuletzt ${relDate(all[0].date)}. Wähle oben einen längeren Zeitraum.</div>`;
  else {
    const best = Math.max(...mine.map(x => mf(x.e) || 0)); const first = mf(mine[mine.length - 1].e), lastV = mf(mine[0].e);
    const sv = m => { if (useReps) return `${m}<small>Wdh.</small>`; if (useVol) { const t = fmtVol(v, m).split(' '); return `${esc(t[0])}<small>${esc(t.slice(1).join(' '))}</small>`; } return statV(ex, v, m); };
    h += `<div class="stats"><div class="stat"><div class="v">${sv(lastV)}</div><div class="l">Zuletzt</div></div><div class="stat"><div class="v">${sv(best)}</div><div class="l">Bestwert</div></div><div class="stat"><div class="v">${mine.length}</div><div class="l">Trainings</div></div></div>`;
    if (first != null && lastV != null && mine.length > 1) { const d = lastV - first; h += `<p class="sline" style="margin:10px 4px 0">In ${curRange()[3]}: <b class="${d > 0 ? 'up' : ''}">${esc(useReps ? `${d > 0 ? '+' : d < 0 ? '−' : '±'}${Math.abs(d)} Wdh.` : useVol ? (d >= 0 ? '+' : '−') + fmtVol(v, Math.round(Math.abs(d) * 10) / 10) : fmtDelta(ex, v, d))}</b>, von ${esc(fm(first))} auf ${esc(fm(lastV))}</p>`; }
  }
  if (others.length) h += `<div class="tog" style="margin:14px 4px 0"><span>Mit ${esc(others.map(o => o.name).join(', '))} vergleichen</span><button class="sw ${p.cmp ? 'on' : ''}" role="switch" aria-checked="${!!p.cmp}" data-act="hdCmp"></button></div>`;
  const label = useReps ? 'Wiederholungen pro Training, alle Sätze' : useVol ? 'Wiederholungen pro Training' : wReps ? `Gewicht (${unitName(v.unit) || 'kg'}), schwerster Satz` : metricLabel(ex, v);
  const showChart = series.some(s => s.pts.length > 1) || (p.cmp && series.filter(s => s.pts.length).length > 1);
  if (showChart) { const ss = series.filter(s => s.pts.length); h += chartBox(label, ss, fm, { labelPoints: ss.length === 1 && ss[0].pts.length <= 8 }); }
  else if (mine.length === 1) h += `<p class="hint">Ab zwei Trainings im Zeitraum erscheint hier das Diagramm.</p>`;
  if (mine.length) h += `<section class="sec"><div class="sec-h"><h2>Verlauf von ${esc(prof(pid).name)}</h2></div><div class="list">${mine.map(x => `<div class="row"><div class="main"><div class="t">${fmtDate(x.date)} ${new Date(x.date).getFullYear()}${x.e.pr ? ` <span class="pr">${I.star}Rekord</span>` : ''}</div><div class="s">${esc(entrySetsText(x.e, ex, v))}</div></div>${useVol ? `<div class="hval"><div class="v" style="font-size:17px">${esc(fmtVol(v, volume(x.e)))}</div></div>` : ''}</div>`).join('')}</div></section>`;
  return h;
}

CH.varInc = el => { const v = exTop().variants.find(x => x.id === el.dataset.v); const s = parseNum(el.value); if (s > 0) v.inc = s; else delete v.inc; touch('app/config'); };

// backup
function exportJson() { return JSON.stringify({ app: 'fitness-logbuch', v: 1, exportedAt: new Date().toISOString(), config: S.config, sessions: S.sessions, body: S.body }); }

/* ================= events ================= */
document.addEventListener('click', e => {

});
document.addEventListener('change', e => { const el = e.target.closest('[data-act-change]'); if (el && CH[el.dataset.actChange]) CH[el.dataset.actChange](el); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[data-act-change]')) e.target.blur(); if (e.key === 'Escape' && ui.sheet) A.closeSheet(); });
let inpT = 0;
document.addEventListener('input', e => {

});
// plan item weights in sheet
CH.itW = el => { const [, it] = findItem(ui.sheet.d, ui.sheet.i); const pid = el.dataset.p, i = +el.dataset.s; const t = it.targets[pid] = it.targets[pid] || { w: [] }; const v = parseNum(el.value); t.w[i] = v; if (i === 0 && v != null) for (let j = 1; j < it.sets; j++) if (t.w[j] == null) t.w[j] = v; t.w = t.w.slice(0, it.sets); if (t.w.every(x => x == null)) delete it.targets[pid]; touch('app/config'); pendingRender = false; setTimeout(render, 0); };
CH.slotLabel = el => { const [, it] = findItem(ui.sheet.d, ui.sheet.i); if (el.value.trim()) { it.label = el.value.trim(); touch('app/config'); } };

// swipe: from left edge = back (pushed screens / close training overview), sheet drag down = close
let sw = null;
document.addEventListener('touchstart', e => { const t = e.touches[0]; const g = e.target.closest('.grab,.sh'); sw = { x: t.clientX, y: t.clientY, edge: t.clientX < 28, sheet: !!g, t: Date.now() }; }, { passive: true });

/* ================= splash ================= */
const splashT0 = Date.now();
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let splashDone = false;
function hideSplash() {
  if (splashDone) return; splashDone = true;
  const sp = document.getElementById('splash'); if (!sp) return;
  sp.classList.add('out'); setTimeout(() => sp.remove(), 500);
}
function splashTick() {
  if (splashDone) return;
  const sub = document.getElementById('spSub');
  if (sub && !sub.dataset.set && C()) {
    sub.dataset.set = 1;
    if (S.active) sub.innerHTML = `Training läuft: <b>${esc(S.active.dayName)}</b>`;
  }
  const t = Date.now() - splashT0, minT = reduceMotion ? 500 : 2100;
  const ready = C() || (dbState !== 'connecting' && !(dbState === 'online' && !subs.config));
  if ((t > minT && ready) || t > 7000) { hideSplash(); return; }
  setTimeout(splashTick, 100);
}
document.addEventListener('click', e => { if (e.target.closest('#splash') && Date.now() - splashT0 > 400) hideSplash(); });

/* ================= Gedrückt halten = schnell zählen ================= */
let hold = null;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-hold]'); if (!b) return;
  const act = b.dataset.act, ds = { ...b.dataset };
  const fire = () => { const f = A[act]; if (f) f({ dataset: ds, closest: () => null }); };
  hold = { n: 0, t: setTimeout(function rep() { hold.n++; fire(); hold.t = setTimeout(rep, hold.n > 12 ? 45 : hold.n > 5 ? 80 : 130); }, 420) };
});
const endHold = () => { if (!hold) return; clearTimeout(hold.t); if (hold.n) swallowClick = Date.now(); hold = null; };
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, endHold));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });

/* ================= swipe to delete & drag to reorder (plan) ================= */
let sx = null, suppressClick = 0, swallowClick = 0;
document.addEventListener('click', e => { if (Date.now() - swallowClick < 500) { swallowClick = 0; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
const SW_OPEN = 88;
function closeSwipes(except) { document.querySelectorAll('.sw-wrap.open').forEach(w => { if (w !== except) { w.classList.remove('open'); w.querySelector('.sw-row').style.transform = ''; } }); }
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (grip) { startDrag(e, grip.closest('.sw-wrap')); return; }
  const delOpen = e.target.closest('.sw-wrap.open > .sw-del');
  const row = e.target.closest('.sw-row') || (delOpen && delOpen.parentElement.querySelector('.sw-row'));
  const anyOpen = document.querySelector('.sw-wrap.open');
  if (anyOpen && !e.target.closest('.sw-del') && (!row || row.parentElement !== anyOpen)) { closeSwipes(); swallowClick = Date.now(); return; }
  if (!row) return;
  const wrap = row.parentElement;
  sx = { x: e.clientX, y: e.clientY, row, wrap, base: wrap.classList.contains('open') ? -SW_OPEN : 0, dx: 0, dir: null, id: e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (drag) { moveDrag(e); return; }
  if (!sx || e.pointerId !== sx.id) return;
  const dx = e.clientX - sx.x, dy = e.clientY - sx.y;
  if (!sx.dir) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) sx.dir = 'h'; else if (Math.abs(dy) > 8) { sx = null; return; } else return; }
  sx.dx = dx; const x = Math.min(0, sx.base + dx);
  sx.row.style.transition = 'none'; sx.row.style.transform = `translateX(${x}px)`;
  sx.wrap.classList.toggle('full', x < -170);
});
function endSwipe() {
  if (drag) { endDrag(); return; }
  if (!sx) return; const s0 = sx; sx = null;
  if (s0.dir !== 'h') return;
  suppressClick = Date.now();
  const x = Math.min(0, s0.base + s0.dx); s0.row.style.transition = ''; s0.wrap.classList.remove('full');
  if (x < -170) { s0.row.style.transform = 'translateX(-100%)'; setTimeout(() => deleteItemUndo(s0.wrap.dataset.d, s0.wrap.dataset.i), 160); }
  else if (x < -40) { s0.row.style.transform = `translateX(${-SW_OPEN}px)`; s0.wrap.classList.add('open'); }
  else { s0.row.style.transform = ''; s0.wrap.classList.remove('open'); }
}
document.addEventListener('pointerup', endSwipe); document.addEventListener('pointercancel', endSwipe);
document.addEventListener('click', e => { if (Date.now() - suppressClick < 350 && e.target.closest('.sw-row,.sw-wrap')) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
document.addEventListener('click', e => { const w = e.target.closest('.sw-wrap.open'); if (w && e.target.closest('.sw-row')) { e.stopImmediatePropagation(); e.preventDefault(); closeSwipes(); } }, true);
let drag = null;
function startDrag(e, wrap) {
  e.preventDefault(); closeSwipes();
  const list = wrap.parentElement; const r = wrap.getBoundingClientRect();
  drag = { wrap, list, y0: e.clientY, top0: r.top, id: e.pointerId };
  wrap.classList.add('dragging'); document.body.classList.add('is-dragging');
}
function moveDrag(e) {
  const { wrap, list } = drag; const dy = e.clientY - drag.y0;
  wrap.style.transform = `translateY(${dy}px)`;
  const sibs = [...list.querySelectorAll(':scope > .sw-wrap')].filter(x => x !== wrap);
  const cy = e.clientY;
  let before = null;
  for (const sb of sibs) { const r = sb.getBoundingClientRect(); if (cy < r.top + r.height / 2) { before = sb; break; } }
  const cur = wrap.nextElementSibling;
  if (before !== cur && !(before === null && (!cur || !cur.classList.contains('sw-wrap')))) {
    const oldTop = wrap.getBoundingClientRect().top - dy;
    if (before) list.insertBefore(wrap, before); else { const lastW = sibs[sibs.length - 1]; lastW.after(wrap); }
    const newTop = wrap.getBoundingClientRect().top - dy;
    drag.y0 += newTop - oldTop; wrap.style.transform = `translateY(${e.clientY - drag.y0}px)`;
  }
  const scr = wrap.closest('.screen'); if (scr) { const sr = scr.getBoundingClientRect(); if (cy < sr.top + 70) scr.scrollTop -= 8; else if (cy > sr.bottom - 150) scr.scrollTop += 8; }
}
function endDrag() {
  const { wrap, list } = drag; drag = null;
  wrap.classList.remove('dragging'); document.body.classList.remove('is-dragging'); wrap.style.transform = '';
  const dayId = wrap.dataset.d; const d = C().days.find(x => x.id === dayId); if (!d) return;
  const order = [...list.querySelectorAll(':scope > .sw-wrap')].map(x => x.dataset.i);
  const before = d.items.map(x => x.id).join();
  d.items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  suppressClick = Date.now();
  if (d.items.map(x => x.id).join() !== before) touch('app/config');
  render();
}

setInterval(() => { const el = document.getElementById('elapsed'); if (el && S.active) el.textContent = fmtDur(Date.now() - S.active.start); }, 1000);

A.trAddCircuit = () => { const a = S.active; const it = makeCircuit(a.participants); a.items.push(it); a.cur = a.items.length - 1; ui.sheet = null; saveActive(); render(); };
A.cMins = el => { curItem().mins = +el.dataset.v; saveActive(); render(); };

A.cStart = () => { unlockAudio(); beep(660, .12); const it = curItem(); it.endAt = Date.now() + it.mins * 60000; it.pausedLeft = null; C().circuitMins = it.mins; touch('app/config'); keepAwake(true); saveActive(); render(); };
A.cPause = () => { const it = curItem(); it.pausedLeft = Math.max(0, it.endAt - Date.now()); it.endAt = null; saveActive(); render(); };
A.cResume = () => { unlockAudio(); const it = curItem(); it.endAt = Date.now() + (it.pausedLeft || 0); it.pausedLeft = null; keepAwake(true); saveActive(); render(); };
A.cStop = () => confirmDlg('Zirkel jetzt beenden? Ihr könnt danach die Runden noch eintragen.', 'Beenden', () => { const it = curItem(); it.finished = true; it.endAt = null; it.pausedLeft = 0; keepAwake(false); saveActive(); }, false);
A.cRound = el => { const it = curItem(); const pp = it.pp[el.dataset.p] = it.pp[el.dataset.p] || { rounds: 0 }; pp.rounds = Math.max(0, pp.rounds + +el.dataset.v); saveActive(); render(); };
A.cSave = () => { const it = curItem(); it.status = 'done'; keepAwake(false); const more = gotoNextOpen(); saveActive(); if (!more) { confirmDlg('Zirkel gespeichert. Training jetzt beenden?', 'Beenden', endTraining, false); } render(); };
let lastBeep = -1;
setInterval(() => {
  if (!S.active || !ui.training) return; const it = curItem(); if (!it || it.kind !== 'circuit' || !it.endAt) return;
  const left = it.endAt - Date.now(), sec = Math.ceil(left / 1000);
  if (left <= 0) { it.finished = true; it.endAt = null; it.pausedLeft = 0; beep(988, .5, .35); setTimeout(() => beep(988, .5, .35), 600); setTimeout(() => beep(1320, .9, .35), 1200); keepAwake(false); saveActive(); render(); const b = $('#cdBox'); if (b) b.classList.add('flash'); return; }
  const c = document.getElementById('cdClock'); if (c) c.textContent = fmtSecs(sec);
  const r = document.getElementById('cdRing'); if (r) { const circ = 2 * Math.PI * 108; r.setAttribute('stroke-dasharray', `${(circ * left / (it.mins * 60000)).toFixed(1)} ${circ.toFixed(1)}`); }
  const box = document.getElementById('cdBox'); if (box) box.classList.toggle('hot', left <= 10000);
  if (sec <= 3 && sec >= 1 && sec !== lastBeep) { lastBeep = sec; beep(660, .15); }
}, 200);


/* ================= boot ================= */
loadLocal();
if (S.active) ui.training = true;
render();
startDb();
splashTick();
// iOS 26.1+: Auf dem Home-Bildschirm endet der Viewport schon über dem Home-Balken. Dann den unteren Sicherheitsabstand nicht nochmal addieren.
function fitStandalone() {
  if (!STANDALONE || window.top !== window) return;
  const sa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const portrait = innerHeight >= innerWidth, full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);

}
fitStandalone(); addEventListener('resize', fitStandalone); addEventListener('orientationchange', () => setTimeout(fitStandalone, 300));
if (STANDALONE && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
